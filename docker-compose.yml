# One command:  docker compose up --build
# App: http://localhost:8080   API docs: http://localhost:8000/docs
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: outfit
      POSTGRES_USER: outfit
      POSTGRES_DB: outfit
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outfit"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://outfit:outfit@db:5432/outfit
      MEDIA_DIR: /srv/media
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      EMBED_BACKEND: ${EMBED_BACKEND:-fashionclip}   # set EMBED_BACKEND=lite for a no-download demo
      COMPAT_CHECKPOINT: /srv/ml/checkpoints/compat.pt
    volumes:
      - media:/srv/media
      - hfcache:/srv/.hf
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  web:
    build:
      context: frontend
      args:
        VITE_API_URL: http://localhost:8000
    depends_on: [api]
    ports: ["8080:80"]

volumes:
  pgdata:
  media:
  hfcache:
